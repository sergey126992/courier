; Настройки PHP для контейнера сервиса оповещений.
date.timezone = UTC
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 8M
post_max_size = 8M
expose_php = Off

; CLI-OPcache: ускоряет тесты и долгоживущие воркеры очереди
; (queue:work, schedule:work). Режим FPM не меняется.
opcache.enable_cli = 1
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
